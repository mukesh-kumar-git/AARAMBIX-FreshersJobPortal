{% extends 'base.html' %}
{% block title %}My Applications{% endblock %}

{% block content %}
<h2>AARAMBIX | My Applications</h2>

{% for app in applications %}
<div class="card">
    <p><strong>{{ app.job.title }}</strong></p>
    <p>Status: {{ app.status }}</p>
</div>
{% empty %}
<p>No applications yet.</p>
{% endfor %}
{% endblock %}
