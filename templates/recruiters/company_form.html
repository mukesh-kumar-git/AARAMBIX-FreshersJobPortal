{% extends "base.html" %}

{% block content %}
<div class="dashboard-box">

    <h2>Company Profile</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            {% if company.name %}
                Update Company
            {% else %}
                Save Company
            {% endif %}
        </button>
    </form>

</div>
{% endblock %}
