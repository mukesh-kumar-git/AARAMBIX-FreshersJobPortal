{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Manage Jobs</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>

{% include "admin_panel/navbar.html" %}

<div class="admin-container">
    <h2>Job Management</h2>

    <table class="table">
        <tr>
            <th>Title</th>
            <th>Recruiter</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for job in jobs %}
        <tr>
            <td>{{ job.title }}</td>
            <td>{{ job.recruiter.username }}</td>
            <td>
                {% if job.is_open %}
                    Open
                {% else %}
                    Closed
                {% endif %}
            </td>
            <td>
                <a href="{% url 'admin_panel:toggle_job_status' job.id %}" class="btn toggle">
                    Toggle
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
