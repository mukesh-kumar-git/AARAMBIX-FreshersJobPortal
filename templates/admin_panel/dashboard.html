{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>

{% include "admin_panel/navbar.html" %}

<div class="admin-container">
    <h1>Admin Dashboard</h1>

    <div class="stats">
        <div class="stat-card">
            <h3>{{ total_users }}</h3>
            <p>Total Users</p>
        </div>

        <div class="stat-card">
            <h3>{{ total_freshers }}</h3>
            <p>Freshers</p>
        </div>

        <div class="stat-card">
            <h3>{{ total_recruiters }}</h3>
            <p>Recruiters</p>
        </div>

        <div class="stat-card">
            <h3>{{ total_jobs }}</h3>
            <p>Jobs Posted</p>
        </div>

        <div class="stat-card">
            <h3>{{ total_applications }}</h3>
            <p>Applications</p>
        </div>
    </div>
</div>

</body>
</html>
